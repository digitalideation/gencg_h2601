<div
  class="video-container"
  style="
    position: relative;
    padding-bottom: 56.25%;
    height: 0;
    overflow: hidden;
  "
>
  <iframe
    src="https://youtube.com/embed/{{ include.id }}"
    style="
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: auto;
      border: 0;
    "
    allow="
      accelerometer;
      autoplay;
      clipboard-write;
      encrypted-media;
      gyroscope;
      picture-in-picture;
      web-share;
    "
    referrerpolicy="strict-origin-when-cross-origin"
    allowfullscreen
  ></iframe>
</div>
