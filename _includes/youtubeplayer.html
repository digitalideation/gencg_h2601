<div
  class="video-container"
  style="
    position: relative;
    padding-bottom: 56.25%;
    height: 0;
    overflow: hidden;
  "
>
  <iframe
    src="https://youtube.com{{ include.id }}"
    style="
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: auto;
      border: 0;
    "
    allowfullscreen
  ></iframe>
</div>
